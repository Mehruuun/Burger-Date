<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burger Date 🍔</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #ffc1d9;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: #7a1646;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .page {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 24px;
    position: relative;
    z-index: 5;
  }
  .page.active { display: flex; }

  h1 {
    font-size: clamp(1.8rem, 6vw, 3rem);
    line-height: 1.3;
  }

  .emoji { font-size: 5rem; }

  .buttons {
    display: flex;
    gap: 24px;
    align-items: center;
    justify-content: center;
    min-height: 70px;
  }

  button {
    font-size: 1.3rem;
    font-weight: 600;
    padding: 14px 40px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: scale(1.06); }

  #yesBtn, #confirmBtn {
    background: #e6286e;
    color: #fff;
    box-shadow: 0 6px 16px rgba(230, 40, 110, 0.4);
  }

  #noBtn {
    background: #fff;
    color: #7a1646;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    transition: left 0.25s ease, top 0.25s ease, transform 0.15s ease;
  }

  input[type="date"], input[type="time"] {
    font-size: 1.2rem;
    padding: 12px 16px;
    border: 2px solid #e6286e;
    border-radius: 14px;
    background: #fff;
    color: #7a1646;
    outline: none;
  }

  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  #confirmBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #finalMsg { font-size: clamp(1.4rem, 5vw, 2.4rem); }
  #finalDate {
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    font-weight: 700;
    background: rgba(255, 255, 255, 0.7);
    padding: 10px 24px;
    border-radius: 16px;
  }

  /* Hearts */
  .heart {
    position: fixed;
    top: -50px;
    user-select: none;
    pointer-events: none;
    z-index: 1;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) rotate(360deg); opacity: 1; }
  }
</style>
</head>
<body>

<!-- Page 1 -->
<div class="page active" id="page1">
  <div class="emoji">🍔</div>
  <h1>Would you like to treat me to a burger, Hana?</h1>
  <div class="buttons" id="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<!-- Page 2 -->
<div class="page" id="page2">
  <div class="emoji">📅</div>
  <h1>Yay! When are we going?</h1>
  <div class="row">
    <input type="date" id="dateInput">
    <input type="time" id="timeInput" value="19:00">
  </div>
  <button id="confirmBtn" disabled>Confirm</button>
</div>

<!-- Page 3 -->
<div class="page" id="page3">
  <div class="emoji">💖</div>
  <h1 id="finalMsg">It's a date! See you soon 🍔</h1>
  <div id="finalDate"></div>
</div>

<script>
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const page3 = document.getElementById('page3');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const confirmBtn = document.getElementById('confirmBtn');

  function show(page) {
    [page1, page2, page3].forEach(p => p.classList.remove('active'));
    page.classList.add('active');
  }

  /* ---- "No" button runs away ---- */
  function dodge() {
    // switch to fixed positioning the first time it moves
    noBtn.style.position = 'fixed';
    const margin = 10;
    const maxX = window.innerWidth - noBtn.offsetWidth - margin;
    const maxY = window.innerHeight - noBtn.offsetHeight - margin;
    const x = Math.max(margin, Math.random() * maxX);
    const y = Math.max(margin, Math.random() * maxY);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.zIndex = 10;
  }

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('mouseover', dodge);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); }, { passive: false });
  noBtn.addEventListener('click', (e) => { e.preventDefault(); dodge(); });

  /* ---- Yes -> date page ---- */
  yesBtn.addEventListener('click', () => {
    noBtn.style.display = 'none';
    const toISO = (d) => d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    const today = new Date();
    const tomorrow = new Date();
    tomorrow.setDate(today.getDate() + 1);
    dateInput.min = toISO(today);      // earliest: today
    dateInput.max = toISO(tomorrow);   // latest: tomorrow
    show(page2);
  });

  dateInput.addEventListener('input', () => {
    // extra safety: reject anything outside today..tomorrow even if typed by hand
    if (dateInput.value && (dateInput.value < dateInput.min || dateInput.value > dateInput.max)) {
      dateInput.value = '';
    }
    confirmBtn.disabled = !dateInput.value;
  });

  /* ---- Confirm -> hearts ---- */
  confirmBtn.addEventListener('click', () => {
    if (!dateInput.value) return;

    const d = new Date(dateInput.value + 'T' + (timeInput.value || '19:00'));
    const text = d.toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    }) + ' at ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    document.getElementById('finalDate').textContent = text;
    show(page3);
    startHearts();
  });

  const heartEmojis = ['❤️', '💖', '💕', '💗', '💘', '💓', '💝'];

  function spawnHeart(initial) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (18 + Math.random() * 40) + 'px';
    const duration = 4 + Math.random() * 5;
    h.style.animationDuration = duration + 's';
    if (initial) h.style.animationDelay = (-Math.random() * duration) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), (duration + 1) * 1000);
  }

  function startHearts() {
    // fill the screen right away
    for (let i = 0; i < 120; i++) spawnHeart(true);
    // keep the hearts coming
    setInterval(() => {
      for (let i = 0; i < 4; i++) spawnHeart(false);
    }, 200);
  }
</script>
</body>
</html>
